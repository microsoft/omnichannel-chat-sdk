name: npm Release

on:
  push:
    branches:
      - main
      - 'hotfix/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'microsoft/omnichannel-chat-sdk'
    runs-on: ubuntu-latest
    outputs:
      release-tarball: ${{ steps.pack-release.outputs.filename }}
      dist-tag: ${{ steps.release.outputs.tag }}
      node-version: ${{ steps.release.outputs.node-version }}
    steps:
      - name: Checking out for ${{ github.ref }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Test release metadata validation
        run: node --test .github/scripts/prepare-release.test.cjs

      - name: Prepare release metadata
        id: release
        run: node .github/scripts/prepare-release.cjs

      - name: Set main prerelease version
        if: github.ref == 'refs/heads/main'
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: npm version "$PACKAGE_VERSION" --no-git-tag-version --ignore-scripts

      - name: Install packages
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build:tsc

      - name: Pack release tarball
        id: pack-release
        run: echo "filename=$(npm pack --ignore-scripts --json | jq -r '.[0].filename')" >> "$GITHUB_OUTPUT"

      - name: Upload release tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball
          path: ${{ steps.pack-release.outputs.filename }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      release-tarball: ${{ needs.build.outputs.release-tarball }}
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.build.outputs.node-version }}
          registry-url: https://registry.npmjs.org

      - name: Download release tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball

      - name: Publish release tarball
        env:
          RELEASE_TARBALL: ${{ needs.build.outputs.release-tarball }}
          NPM_DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npx npm@11.12.1 publish "$RELEASE_TARBALL" --ignore-scripts --provenance --tag "$NPM_DIST_TAG" --access public

  github-release:
    if: needs.publish.result == 'success' && github.repository == 'microsoft/omnichannel-chat-sdk' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checking out for ${{ github.ref }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download release tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball

      - name: Extract CHANGELOG section for ${{ github.ref_name }}
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::warning::No CHANGELOG entry found for version $VERSION; falling back to auto-generated notes."
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          else
            echo "fallback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.fallback == 'false' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.fallback == 'true' }}
          files: ${{ needs.publish.outputs.release-tarball }}
          fail_on_unmatched_files: true
